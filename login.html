<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync Login</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">Skill<span>Sync</span></div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="leaderboard.html">Leaderboard</a></li>
            <li><a href="games.html">Games</a></li>
            <li><a href="about.html">About</a></li>

            <li>
                <a href="login.html" id="loginNav" class="nav-login-btn active">
                    Login
                </a>
            </li>

            <li><a href="admin.html">Admin Panel</a></li>
        </ul>

        <button class="gold-btn" onclick="openPopup()">
            Start Matchmaking
        </button>
    </nav>
</header>

<section class="login-wrapper reveal">

    <div class="login-box">
        <h2>WELCOME BACK</h2>

        <p class="login-subtitle">
            Access your competitive profile
        </p>

        <input id="username" type="text" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <div class="captcha-box">
    <div class="g-recaptcha"
         data-sitekey="6Lffqe0sAAAAAD3G4fvKrBdGuVFgvT_Eh1YZlOSx">
    </div>
</div>

        <button class="gold-btn full-btn" onclick="userLogin()">
            User Login
        </button>

        <br><br>

        <button class="outline-btn full-btn" onclick="adminLogin()">
            Admin Login
        </button>

        <p class="oauth-title">
            OR CONTINUE WITH
        </p>

        <button class="oauth-btn google-btn" onclick="oauthLogin('Google')">
            <i class="fab fa-google"></i>
            Continue with Google
        </button>

        <button class="oauth-btn discord-btn" onclick="oauthLogin('Discord')">
            <i class="fab fa-discord"></i>
            Continue with Discord
        </button>

        <button class="oauth-btn github-btn" onclick="oauthLogin('GitHub')">
            <i class="fab fa-github"></i>
            Continue with GitHub
        </button>

        <p style="
            text-align:center;
            margin-top:18px;
            color:rgba(255,255,255,0.45);
            font-size:13px;
        ">
            Demo admin credentials: admin / admin123
        </p>
    </div>

</section>

<!-- POPUP -->
<div class="popup" id="popup">
    <div class="popup-box">
        <h2>Competitive Matchmaking</h2>

        <input type="text" placeholder="Player Name">
        <input type="number" placeholder="Win Rate %">
        <input type="number" placeholder="K/D Ratio">
        <input type="number" placeholder="Consistency Score">

        <div class="popup-buttons">
            <button class="gold-btn" onclick="startMatchmaking()">
                Find Match
            </button>

            <button class="outline-btn" onclick="closePopup()">
                Close
            </button>
        </div>
    </div>
</div>

<!-- LOADER -->
<div class="loading-screen" id="loadingScreen">
    <div class="loader"></div>
    <h2>Finding Competitive Match...</h2>
</div>

<!-- FLOATING CONTACT -->
<a href="contact.html" class="floating-contact">
    <i class="fas fa-comment-dots"></i>
    Contact Us
</a>

<script src="script.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

</body>
</html>
